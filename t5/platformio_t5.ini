; =============================================================================
; LILYGO T5 4.7" E-Paper (ESP32-S3) - Remote client display
;
; Fully isolated from the Touch LCD build.
; Build:   pio run --project-conf t5/platformio_t5.ini
; Upload:  pio run --project-conf t5/platformio_t5.ini -t upload
; Monitor: pio device monitor --project-conf t5/platformio_t5.ini
; =============================================================================

[platformio]
src_dir = t5/src
include_dir = t5/include
; Shared library for data managers, MQTT, WiFi, time
lib_extra_dirs = shared

[env:t5-epaper]

platform = espressif32@ 6.9.0
board = esp32-s3-devkitc-1
framework = arduino

board_build.f_flash = 80000000L
board_build.flash_mode = qio
board_upload.flash_size = 16MB
board_build.arduino.memory_type = qio_opi
board_build.psram_type = opi

board_build.partitions = default_8MB.csv
upload_speed = 921600
monitor_speed = 115200

build_flags =
	-D CORE_DEBUG_LEVEL=3
	-D ARDUINO_USB_MODE=1
	-D ARDUINO_USB_CDC_ON_BOOT=1
	-D BOARD_HAS_PSRAM
	-mfix-esp32-psram-cache-issue

	; T5 board identifier
	-D LILYGO_T5_EPD47_S3

	; Performance optimizations
	-D CONFIG_FREERTOS_HZ=1000
	-D CONFIG_ESP32S3_DATA_CACHE_LINE_64B=1
	-D CONFIG_SPIRAM_FETCH_INSTRUCTIONS=1
	-D CONFIG_SPIRAM_RODATA=1
	-O3

	; Force LVGL to use T5-specific lv_conf.h
	-I t5/include
	-D LV_CONF_PATH="${PROJECT_DIR}/t5/include/lv_conf.h"

monitor_filters = esp32_exception_decoder
lib_ldf_mode = deep

lib_deps =
	SPI
	Wire
	https://github.com/knolleary/pubsubclient.git
	lvgl/lvgl @ 9.1.0
	https://github.com/lewisxhe/SensorLib.git
	https://github.com/Xinyuan-LilyGO/LilyGo-EPD47.git#esp32s3
