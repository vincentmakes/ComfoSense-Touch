; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:esp32s3]

platform = espressif32@ 6.9.0
board = esp32-s3-devkitc-1
framework = arduino

; Exclude T5 e-paper source files from Touch LCD build
build_src_filter = +<*> -<t5/>

;board = esp32s3box
board_build.f_flash = 80000000L
board_build.flash_mode = qio
board_upload.flash_size = 16MB
board_build.arduino.memory_type = qio_opi
board_build.psram_type = opi

board_build.partitions = default_8MB.csv
; Quality of life
upload_speed = 921600
monitor_speed = 115200

; optional but nice:

build_flags = 
	-D CORE_DEBUG_LEVEL=3
	-D ARDUINO_USB_MODE=1
	-D ARDUINO_USB_CDC_ON_BOOT=1
	-D BOARD_HAS_PSRAM
	-mfix-esp32-psram-cache-issue
	
	
	; Performance optimizations
	-D CONFIG_FREERTOS_HZ=1000
	-D CONFIG_ESP32S3_DATA_CACHE_LINE_64B=1
	-D CONFIG_SPIRAM_FETCH_INSTRUCTIONS=1
	-D CONFIG_SPIRAM_RODATA=1
	-O3

	; Force LVGL to use our lv_conf.h
	-I include
	-D LV_CONF_PATH="${PROJECT_DIR}/include/lv_conf.h"

; change to COM on windows devices
upload_port = /dev/cu.usbmodem1101
; change to COM on windows devices
monitor_port = /dev/cu.usbmodem1101

monitor_filters = esp32_exception_decoder
lib_ldf_mode = deep

;extra_scripts = pre:fix_lvgl_compatibility.py
lib_deps = 
	SPI
	Wire
;	can_common=https://github.com/collin80/can_common.git
;	esp32_can=https://github.com/collin80/esp32_can.git
	https://github.com/knolleary/pubsubclient.git
	tzapu/WiFiManager @ ^2.0.17
	lvgl/lvgl @ 9.1.0
	moononournation/GFX Library for Arduino @ 1.3.7
	https://github.com/lewisxhe/SensorLib.git

; =============================================================================
; LILYGO T5 4.7" E-Paper (ESP32-S3) - Remote client display
; Build: pio run -e t5-epaper
; =============================================================================
[env:t5-epaper]

platform = espressif32@ 6.9.0
board = esp32-s3-devkitc-1
framework = arduino

; Only compile T5-specific source files
build_src_filter = +<t5/>

; Use shared library for data managers, MQTT, WiFi, time
lib_extra_dirs = shared

board_build.f_flash = 80000000L
board_build.flash_mode = qio
board_upload.flash_size = 16MB
board_build.arduino.memory_type = qio_opi
board_build.psram_type = opi

board_build.partitions = default_8MB.csv
upload_speed = 921600
monitor_speed = 115200

build_flags =
	-D CORE_DEBUG_LEVEL=3
	-D ARDUINO_USB_MODE=1
	-D ARDUINO_USB_CDC_ON_BOOT=1
	-D BOARD_HAS_PSRAM
	-mfix-esp32-psram-cache-issue

	; T5 board identifier
	-D LILYGO_T5_EPD47_S3

	; Performance optimizations
	-D CONFIG_FREERTOS_HZ=1000
	-D CONFIG_ESP32S3_DATA_CACHE_LINE_64B=1
	-D CONFIG_SPIRAM_FETCH_INSTRUCTIONS=1
	-D CONFIG_SPIRAM_RODATA=1
	-O3

	; Force LVGL to use T5-specific lv_conf.h
	-I include_t5
	-D LV_CONF_PATH="${PROJECT_DIR}/include_t5/lv_conf.h"

monitor_filters = esp32_exception_decoder
lib_ldf_mode = deep

lib_deps =
	SPI
	Wire
	https://github.com/knolleary/pubsubclient.git
	lvgl/lvgl @ 9.1.0
	https://github.com/lewisxhe/SensorLib.git
	https://github.com/Xinyuan-LilyGO/LilyGo-EPD47.git#esp32s3
